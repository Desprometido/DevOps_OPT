name: Secure Pipeline CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código para o runner
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar o código da Calculadora
      run: javac src/calculadora/Calculadora.java

  # 1. Nó de SAST
  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Executar Semgrep SAST
      uses: returntocorp/semgrep-action@v1
      with:
        config: "p/default"

  # 2. Nó de DAST
  dast:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Executar OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.14.0
      with:
        target: 'https://example.com'
      continue-on-error: true   # para não dar erro (simulação)