name: Java CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código para o runner
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK)
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar o código da Calculadora
      run: javac Calculadora.java

    - name: Verificar sucesso
      run: echo "Pipeline executada com sucesso! O código compila perfeitamente."